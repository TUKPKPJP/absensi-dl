<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Absensi DL</title>
<style>
  :root{--bg:#F5F7F3;--surface:#FFFFFF;--surface2:#EEF2EA;--border:#DBE3D5;--text:#1E2A22;--muted:#66756A;--green:#3F8F52;--amber:#B8791A;--red:#B8453B;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace;padding:0 14px 60px;}
  .topbar{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:22px 16px 18px;background:var(--surface);border-bottom:1px solid var(--border);margin:0 -14px 18px;}
  .logo{width:92px;height:92px;object-fit:contain;margin-bottom:8px;}
  .appname{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;color:var(--text);}
  .orgname{font-size:12px;color:var(--muted);margin-top:1px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:14px;}
  label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px;}
  input[type=text]{width:100%;font-family:inherit;font-size:13.5px;background:var(--surface2);
    border:1px solid var(--border);border-radius:6px;padding:9px 11px;color:var(--text);margin-bottom:12px;}
  button{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;padding:11px 18px;
    border-radius:7px;border:none;cursor:pointer;background:var(--green);color:#FFFFFF;width:100%;}
  button:disabled{background:#C7CFC2;color:#FFFFFF;cursor:not-allowed;}
  button.outline{background:transparent;border:1px solid var(--green);color:var(--green);margin-top:8px;}
  .muted{color:var(--muted);font-size:12.5px;}
  .badge{display:inline-flex;align-items:center;gap:6px;border-radius:5px;padding:3px 9px;font-size:12px;font-weight:500;border:1px solid;}
  .badge.green{color:#2E7A40;background:#3F8F521A;border-color:#3F8F5255;}
  .badge.amber{color:#96600F;background:#B8791A1A;border-color:#B8791A55;}
  .badge.red{color:#96342B;background:#B8453B1A;border-color:#B8453B55;}
  .note{font-size:11.5px;color:#8A968D;margin-top:10px;}
  .spin{display:inline-block;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  video{width:100%;border-radius:8px;background:#000;display:block;}
</style>
</head>

  <div class="appname">Absensi DL</div>
  <div class="orgname">Sudin KPKP Jakarta Pusat</div>
</div>

<div class="card" id="startCard">
  <label>Nama pegawai</label>
  <input type="text" id="name" placeholder="cth. Budi Santoso">
  <label>Lokasi / alamat tugas hari ini</label>
  <input type="text" id="locText" placeholder="cth. Kantor Cabang Bekasi, Jl. Ahmad Yani No. 12">
  <button onclick="startCamera()">Mulai Kamera</button>
  <div class="note">Kamera dan lokasi aktif bersamaan. Foto langsung terkirim begitu Anda menekan tombol jepret.</div>
</div>

<div class="card" id="cameraCard" style="display:none;">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas" style="display:none;"></canvas>
  <div id="overlayStatus" class="muted" style="margin-top:10px;">Menunggu sinyal GPS…</div>
  <button id="btnCapture" onclick="captureAndSend()" disabled style="margin-top:12px;">📸 Jepret &amp; Kirim Sekarang</button>
</div>

<div id="sendingBox"></div>
<div id="doneBox"></div>
<div id="errorBox"></div>

<iframe name="hidden_target" style="display:none;"></iframe>
<form id="sendForm" method="POST" target="hidden_target" style="display:none;">
  <input type="hidden" name="employeeName" id="f_employeeName">
  <input type="hidden" name="locationText" id="f_locationText">
  <input type="hidden" name="lat" id="f_lat">
  <input type="hidden" name="lng" id="f_lng">
  <input type="hidden" name="accuracy" id="f_accuracy">
  <input type="hidden" name="confidence" id="f_confidence">
  <input type="hidden" name="flagAccuracy" id="f_flagAccuracy">
  <input type="hidden" name="flagJitter" id="f_flagJitter">
  <input type="hidden" name="flagSensor" id="f_flagSensor">
  <input type="hidden" name="photoBase64" id="f_photoBase64">
</form>

<script>
// ====== GANTI DENGAN URL WEB APP APPS SCRIPT ANDA (yang diakhiri /exec) ======
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzE6trp1PWNpnrQpF_JHGVTz8g_ZLUdbdcD_-MQNDDwMi8IesVaYh4DZzfqWWZTjxjA/exec';
// ==============================================================================

let stream = null;
let watchId = null;
let collected = [];

function haversine(lat1, lon1, lat2, lon2){
  const R=6371000, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

async function startCamera(){
  const name = document.getElementById('name').value.trim();
  const locText = document.getElementById('locText').value.trim();
  if(!name || !locText){ alert('Isi nama dan lokasi/alamat tugas dulu'); return; }
  if(APPS_SCRIPT_URL.indexOf('PASTE_URL') === 0){
    alert('Admin belum mengisi URL Apps Script di kode index.html (APPS_SCRIPT_URL).');
    return;
  }
  document.getElementById('errorBox').innerHTML = '';

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    document.getElementById('errorBox').innerHTML = '<div class="card" style="border-color:var(--red);color:var(--red);">Browser ini tidak mendukung akses kamera langsung.</div>';
    return;
  }

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 960 } },
      audio: false
    });
  } catch(err){
    document.getElementById('errorBox').innerHTML = '<div class="card" style="border-color:var(--red);color:var(--red);">Gagal mengakses kamera: ' + err.message + '. Pastikan izin kamera diizinkan di browser.</div>';
    return;
  }

  const video = document.getElementById('video');
  video.srcObject = stream;
  video.onloadeddata = function(){ document.getElementById('btnCapture').disabled = false; };

  document.getElementById('startCard').style.display = 'none';
  document.getElementById('cameraCard').style.display = 'block';

  collected = [];
  if(navigator.geolocation){
    watchId = navigator.geolocation.watchPosition(function(pos){
      collected.push({lat:pos.coords.latitude, lng:pos.coords.longitude, accuracy:pos.coords.accuracy,
        altitude:pos.coords.altitude, speed:pos.coords.speed, heading:pos.coords.heading});
      document.getElementById('overlayStatus').textContent = 'Sinyal GPS: ' + collected.length + ' pembacaan, akurasi ±' + Math.round(pos.coords.accuracy) + ' m';
    }, function(err){
      document.getElementById('overlayStatus').textContent = 'GPS belum siap: ' + err.message + ' — tunggu sebentar.';
    }, {enableHighAccuracy:true, maximumAge:0, timeout:10000});
  } else {
    document.getElementById('overlayStatus').textContent = 'Perangkat tidak mendukung GPS.';
  }
}

function stopAll(){
  if(watchId != null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
  if(stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
}

function stampPhoto(ctx, w, h, primary, name){
  const lines = [name, 'Koordinat: ' + primary.lat.toFixed(6) + ', ' + primary.lng.toFixed(6)];
  const fontSize = Math.max(13, Math.round(w * 0.03));
  const lineHeight = fontSize + 7;
  const padding = 12;
  const boxHeight = lines.length * lineHeight + padding * 2;
  const grad = ctx.createLinearGradient(0, h - boxHeight, 0, h);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(0.35, 'rgba(0,0,0,0.55)');
  grad.addColorStop(1, 'rgba(0,0,0,0.8)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, h - boxHeight, w, boxHeight);
  ctx.fillStyle = '#FFFFFF';
  ctx.font = '600 ' + fontSize + 'px monospace';
  ctx.textBaseline = 'top';
  lines.forEach(function(line, i){
    ctx.fillText(line, padding, h - boxHeight + padding + i * lineHeight);
  });
}

function captureAndSend(){
  if(collected.length === 0){
    alert('GPS belum mendapat sinyal, tunggu sebentar lalu coba lagi.');
    return;
  }
  document.getElementById('btnCapture').disabled = true;

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const w = video.videoWidth, h = video.videoHeight;
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, w, h);

  const primary = collected[collected.length - 1];
  let jitter = 0;
  for(let i=0;i<collected.length;i++) for(let j=i+1;j<collected.length;j++)
    jitter = Math.max(jitter, haversine(collected[i].lat, collected[i].lng, collected[j].lat, collected[j].lng));

  const accuracyFlag = primary.accuracy==null ? 'missing' : primary.accuracy>100 ? 'low' : Number.isInteger(primary.accuracy) ? 'round' : 'ok';
  const sensorFlag = (primary.altitude==null && primary.speed==null && primary.heading==null) ? 'missing' : 'ok';
  const jitterFlag = collected.length>=3 ? (jitter<0.3 ? 'static' : jitter>300 ? 'unstable' : 'ok') : 'insufficient';
  const hardFlag = jitterFlag === 'unstable';
  const minorCount = [accuracyFlag==='low', accuracyFlag==='round', sensorFlag==='missing', jitterFlag==='static'].filter(Boolean).length;
  const confidence = hardFlag ? 'rendah' : minorCount>=2 ? 'sedang' : 'tinggi';

  const name = document.getElementById('name').value.trim();
  stampPhoto(ctx, w, h, primary, name);
  const photoBase64 = canvas.toDataURL('image/jpeg', 0.6);

  stopAll();
  document.getElementById('cameraCard').style.display = 'none';
  document.getElementById('sendingBox').innerHTML = '<div class="card" style="text-align:center;"><span class="spin">⟳</span> Mengirim absen…</div>';

  const payload = {
    employeeName: name,
    locationText: document.getElementById('locText').value.trim(),
    lat: primary.lat, lng: primary.lng, accuracy: primary.accuracy,
    confidence: confidence,
    flags: { accuracy: accuracyFlag, jitter: jitterFlag, sensor: sensorFlag },
    photoBase64: photoBase64
  };

  sendViaForm(payload, function(){
    document.getElementById('sendingBox').innerHTML = '';
    const badgeClass = confidence==='tinggi' ? 'green' : confidence==='sedang' ? 'amber' : 'red';
    const badgeText = confidence==='tinggi' ? 'Tinggi' : confidence==='sedang' ? 'Sedang — akan ditinjau admin' : 'Rendah — akan ditinjau admin';
    document.getElementById('doneBox').innerHTML =
      '<div class="card" style="text-align:center;"><div style="font-size:32px;">✅</div>' +
      '<div style="font-weight:600;margin:10px 0 4px;">Absen terkirim</div>' +
      '<div class="muted">Jam resmi tersimpan otomatis di server (cek di Dashboard Admin).</div>' +
      '<div style="margin-top:10px;"><span class="badge ' + badgeClass + '">' + badgeText + '</span></div></div>' +
      '<button class="outline" onclick="location.reload()">Absen lagi</button>';
  });
}

function sendViaForm(payload, onDone){
  const form = document.getElementById('sendForm');
  form.action = APPS_SCRIPT_URL;
  document.getElementById('f_employeeName').value = payload.employeeName;
  document.getElementById('f_locationText').value = payload.locationText;
  document.getElementById('f_lat').value = payload.lat;
  document.getElementById('f_lng').value = payload.lng;
  document.getElementById('f_accuracy').value = payload.accuracy;
  document.getElementById('f_confidence').value = payload.confidence;
  document.getElementById('f_flagAccuracy').value = payload.flags.accuracy;
  document.getElementById('f_flagJitter').value = payload.flags.jitter;
  document.getElementById('f_flagSensor').value = payload.flags.sensor;
  document.getElementById('f_photoBase64').value = payload.photoBase64;

  const iframe = document.querySelector('iframe[name="hidden_target"]');
  let done = false;
  const finish = function(){
    if(done) return;
    done = true;
    onDone();
  };
  iframe.onload = finish;
  setTimeout(finish, 8000); // jaga-jaga kalau event load tidak muncul di beberapa browser

  form.submit();
}
</script>
